<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎯 빙고 멀티</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080815;--card:#10102a;--border:#1e1e45;--a1:#f7c948;--a2:#ff5e87;--a3:#4ef7c9;--text:#e8e8ff;--muted:#555588}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(78,247,201,.05) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 90%,rgba(255,94,135,.05) 0%,transparent 50%)}
input{-webkit-user-select:auto;user-select:auto}

.page{display:none;flex-direction:column;align-items:center;min-height:100vh;overflow-y:auto;overflow-x:hidden;padding:20px 14px 70px}
.page.active{display:flex}

.logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(2rem,7vw,3.2rem);letter-spacing:.18em;
  background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:glow 2.5s ease-in-out infinite alternate;margin-bottom:4px}
@keyframes glow{from{filter:drop-shadow(0 0 10px rgba(247,201,72,.3))}to{filter:drop-shadow(0 0 28px rgba(247,201,72,.7))}}
.sub{font-size:.75rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:18px}

.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;width:100%;max-width:440px;margin-bottom:10px}
.card-title{font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}

.inp{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:1rem;font-family:'Noto Sans KR',sans-serif;color:var(--text);outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--a3)}
.inp-row{display:flex;gap:8px}

.btn{font-family:'Black Han Sans',sans-serif;font-size:.88rem;letter-spacing:.06em;padding:10px 18px;border:2px solid;border-radius:8px;cursor:pointer;transition:all .18s;background:transparent;display:inline-block;text-decoration:none;text-align:center}
.btn:active{transform:scale(.96)}
.btn-y{color:var(--a1);border-color:var(--a1)}.btn-y:hover{background:var(--a1);color:#000;box-shadow:0 0 18px rgba(247,201,72,.4)}
.btn-c{color:var(--a3);border-color:var(--a3)}.btn-c:hover{background:var(--a3);color:#000;box-shadow:0 0 18px rgba(78,247,201,.4)}
.btn-r{color:var(--a2);border-color:var(--a2)}.btn-r:hover{background:var(--a2);color:#fff}
.btn-ghost{color:var(--muted);border-color:var(--border)}.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:.76rem}
.btn:disabled{opacity:.3;cursor:not-allowed;pointer-events:none}

.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:440px;margin-bottom:10px}

/* Room code */
.code-box{display:flex;align-items:center;gap:10px;background:rgba(78,247,201,.07);border:1.5px solid var(--a3);border-radius:10px;padding:10px 14px}
.code-txt{font-family:'Black Han Sans',sans-serif;font-size:1.8rem;letter-spacing:.3em;color:var(--a3);flex:1}
.copy-btn{background:rgba(78,247,201,.15);border:1px solid var(--a3);border-radius:6px;color:var(--a3);padding:5px 12px;cursor:pointer;font-size:.72rem;font-family:'Black Han Sans',sans-serif;transition:all .2s;white-space:nowrap}
.copy-btn:active{transform:scale(.95)}

/* Player items */
.p-item{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;transition:border-color .2s}
.p-item.me{border-color:var(--a3)}
.p-name{flex:1;font-size:.88rem;font-weight:700}
.badge{font-size:.6rem;padding:2px 7px;border-radius:12px;font-weight:700;letter-spacing:.04em}
.badge-host{background:rgba(247,201,72,.15);color:var(--a1)}
.badge-ready{background:rgba(78,247,201,.15);color:var(--a3)}
.badge-wait{background:rgba(85,85,136,.15);color:var(--muted)}
.badge-you{background:rgba(78,247,201,.1);color:var(--a3);font-size:.58rem}

/* Status */
.status{text-align:center;font-size:.88rem;color:var(--a3);min-height:1.3em;margin-bottom:10px;transition:color .3s;padding:0 8px}

/* Setup board (lobby) */
.setup-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:380px;margin:0 auto 12px}
.sc{aspect-ratio:1;border:2px solid var(--border);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;transition:border-color .2s}
.sc.has-v{border-color:#2a2a55}
.sc.dup{border-color:var(--a2);background:rgba(255,94,135,.08)}
.sc input{width:100%;height:100%;background:transparent;border:none;outline:none;text-align:center;font-family:'Black Han Sans',sans-serif;font-size:clamp(.9rem,3.5vw,1.3rem);color:var(--text);-moz-appearance:textfield;cursor:text}
.sc input::-webkit-inner-spin-button,.sc input::-webkit-outer-spin-button{-webkit-appearance:none}
.sc input::placeholder{color:var(--border);font-size:.9rem}
.sc input:focus{color:var(--a3)}

/* Game board */
.game-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;width:100%;max-width:380px;margin:0 auto}
.gc{aspect-ratio:1;border:2px solid var(--border);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:'Black Han Sans',sans-serif;font-size:clamp(1rem,4vw,1.4rem);cursor:pointer;transition:all .2s;position:relative;color:var(--text)}
.gc:hover:not(.marked):not(.no-turn){border-color:var(--a1);background:rgba(247,201,72,.08);transform:scale(1.05);box-shadow:0 0 12px rgba(247,201,72,.2)}
.gc.marked{background:var(--a1);border-color:var(--a1);color:#0d0d1a;box-shadow:0 0 14px rgba(247,201,72,.45);transform:scale(1.03)}
.gc.marked .star{position:absolute;top:3px;right:5px;font-size:.55rem;color:#0d0d1a;opacity:.6}
.gc.bingo-line{background:linear-gradient(135deg,#f7c948,#ff5e87);border-color:var(--a2);color:#fff;box-shadow:0 0 22px rgba(255,94,135,.65);animation:bpulse .8s ease-in-out infinite alternate}
@keyframes bpulse{from{box-shadow:0 0 14px rgba(255,94,135,.45)}to{box-shadow:0 0 32px rgba(255,94,135,.9)}}
.gc.no-turn{cursor:default}
.gc.no-turn:hover:not(.marked){border-color:var(--border);background:var(--card);transform:none;box-shadow:none}

/* Turn box */
.turn-box{background:rgba(85,85,136,.12);border:1.5px solid var(--border);border-radius:10px;padding:8px 14px;text-align:center;margin-bottom:10px;font-family:'Black Han Sans',sans-serif;font-size:.88rem;color:var(--muted);transition:all .3s}
.turn-box.my-turn{border-color:var(--a1);color:var(--a1);background:rgba(247,201,72,.07);animation:tpulse 1.2s ease-in-out infinite alternate}
@keyframes tpulse{from{box-shadow:0 0 6px rgba(247,201,72,.15)}to{box-shadow:0 0 20px rgba(247,201,72,.45)}}

/* Bingo dots */
.dots{display:flex;gap:8px;justify-content:center;margin-top:8px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);background:var(--card);transition:all .4s}
.dot.lit{background:linear-gradient(135deg,var(--a1),var(--a2));border-color:var(--a1);box-shadow:0 0 10px rgba(247,201,72,.6);animation:dpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes dpop{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* Called numbers */
.called-wrap{margin-top:10px;padding:8px 10px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;min-height:36px;max-height:60px;overflow-y:auto}
.called-lbl{font-size:.6rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.called-nums{display:flex;flex-wrap:wrap;gap:3px}
.cn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:5px;background:rgba(247,201,72,.12);color:var(--a1);font-family:'Black Han Sans',sans-serif;font-size:.75rem;border:1px solid rgba(247,201,72,.2)}
.cn.mine{background:rgba(78,247,201,.12);color:var(--a3);border-color:rgba(78,247,201,.2)}

/* Opponent info */
.opp-bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;background:rgba(255,94,135,.05);border:1px solid rgba(255,94,135,.2);border-radius:8px;margin-top:8px}
.opp-name{font-size:.82rem;color:var(--text);font-weight:700}
.opp-bingo{font-family:'Black Han Sans',sans-serif;font-size:.88rem;color:var(--a2)}

/* Win overlay */
#win-ov{display:none;position:fixed;inset:0;background:rgba(8,8,21,.88);backdrop-filter:blur(6px);z-index:100;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:20px}
#win-ov.show{display:flex;animation:fadein .4s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.win-title{font-family:'Black Han Sans',sans-serif;font-size:clamp(2.8rem,11vw,5.5rem);text-align:center;
  background:linear-gradient(135deg,#f7c948,#ff5e87,#4ef7c9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.win-sub{color:var(--text);font-size:.95rem;text-align:center;line-height:1.6;color:var(--muted)}

/* Menu topbar button (top-right, same style as tetris) */
.menu-topbar{position:fixed;top:8px;right:8px;z-index:60;background:rgba(16,16,42,.9);border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 10px;font-size:.8rem;cursor:pointer;font-family:'Black Han Sans',sans-serif;letter-spacing:.04em;transition:all .2s;outline:none}
.menu-topbar:hover{border-color:var(--a3);color:var(--a3)}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(16,16,42,.96);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:.83rem;opacity:0;transition:opacity .28s;z-index:200;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* Confetti */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.cp{position:absolute;top:-12px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* Page game specific */
#page-game{padding-top:14px;padding-bottom:60px}
.game-inner{width:100%;max-width:400px;margin:0 auto}

/* Header in game */
.game-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.g-title{font-family:'Black Han Sans',sans-serif;font-size:1rem;letter-spacing:.1em;color:var(--a1)}
.g-bingo-num{font-family:'Black Han Sans',sans-serif;font-size:1.1rem;color:var(--a1)}

.leave-btn{background:rgba(85,85,136,.2);border:1px solid var(--border);border-radius:6px;color:var(--muted);padding:4px 10px;font-size:.72rem;cursor:pointer;font-family:'Black Han Sans',sans-serif;transition:all .2s}
.leave-btn:hover{border-color:var(--a2);color:var(--a2)}
</style>
</head>
<body>

<button onclick="goToMenu()" class="menu-topbar">🎮 메뉴</button>
<div id="confetti"></div>
<div id="toast"></div>

<!-- WIN OVERLAY -->
<div id="win-ov">
  <div id="win-title" class="win-title">🎉</div>
  <div id="win-sub" class="win-sub"></div>
  <div class="row" style="margin-top:8px">
    <button class="btn btn-y" onclick="sendRestart()">다시하기</button>
    <button class="btn btn-ghost" onclick="goToMenu()">🎮 메뉴로</button>
  </div>
</div>

<!-- ═══════ PAGE: ENTRY ═══════ -->
<div id="page-entry" class="page active">
  <div class="logo" style="margin-top:36px">BINGO</div>
  <div class="sub">1 vs 1 온라인 턴제</div>

  <div class="card">
    <div class="card-title">닉네임</div>
    <input class="inp" id="entry-name" placeholder="이름 입력..." maxlength="12">
  </div>

  <div class="row">
    <button class="btn btn-y" onclick="createRoom()">🏠 방 만들기</button>
  </div>

  <div class="card">
    <div class="card-title">방 참가 (초대 코드 입력)</div>
    <div class="inp-row">
      <input class="inp" id="join-code" placeholder="예) AB12CD" maxlength="6" style="flex:1;text-transform:uppercase">
      <button class="btn btn-c" onclick="joinRoom()">참가</button>
    </div>
  </div>

  <div id="status-entry" class="status" style="margin-top:6px">서버 연결 중...</div>
</div>

<!-- ═══════ PAGE: LOBBY ═══════ -->
<div id="page-lobby" class="page">
  <div class="logo" style="margin-top:36px">BINGO</div>
  <div class="sub">로비</div>

  <div class="card">
    <div class="card-title">초대 코드 — 상대방에게 공유하세요</div>
    <div class="code-box">
      <div class="code-txt" id="lobby-code">------</div>
      <div class="copy-btn" onclick="copyCode()">📋 복사</div>
    </div>
  </div>

  <div class="card" id="players-card">
    <div class="card-title" id="players-title">플레이어 (0/2)</div>
    <div id="player-list"></div>
  </div>

  <div class="card">
    <div class="card-title">내 빙고판 설정 (1~25, 중복 없이)</div>
    <div id="setup-grid" class="setup-grid"></div>
    <div class="row" style="margin:0">
      <button class="btn btn-c btn-sm" onclick="autoFill()">🎲 자동 채우기</button>
      <button class="btn btn-ghost btn-sm" onclick="resetSetup()">초기화</button>
    </div>
  </div>

  <div id="status-lobby" class="status">상대방을 기다리는 중...</div>

  <div class="row">
    <button class="btn btn-c" id="ready-btn" onclick="toggleReady()">✔ 준비</button>
    <button class="btn btn-y" id="start-btn" onclick="startGame()" style="display:none" disabled>▶ 게임 시작</button>
  </div>
  <div style="margin-top:6px">
    <button class="btn btn-ghost btn-sm" onclick="leaveRoom()">나가기</button>
  </div>
</div>

<!-- ═══════ PAGE: GAME ═══════ -->
<div id="page-game" class="page">
  <div class="game-inner">
    <div class="game-header">
      <span class="g-title">🎯 내 빙고판</span>
      <span class="g-bingo-num" id="my-bingo-txt">0 빙고</span>
      <button class="leave-btn" onclick="leaveRoom()">나가기</button>
    </div>

    <div id="turn-box" class="turn-box">...</div>

    <div id="game-grid" class="game-grid"></div>

    <div class="dots" id="my-dots">
      <div class="dot" id="md0"></div>
      <div class="dot" id="md1"></div>
      <div class="dot" id="md2"></div>
      <div class="dot" id="md3"></div>
      <div class="dot" id="md4"></div>
    </div>

    <div class="opp-bar" style="margin-top:10px">
      <span class="opp-name">👤 <span id="opp-name-txt">상대방</span></span>
      <span class="opp-bingo" id="opp-bingo-txt">0 빙고</span>
    </div>

    <div class="called-wrap">
      <div class="called-lbl">호출된 숫자</div>
      <div class="called-nums" id="called-nums"></div>
    </div>

    <div id="status-game" class="status" style="margin-top:10px;font-size:.8rem;color:var(--muted)"></div>
  </div>
</div>

<script>
/* ════════════════ 상태 ════════════════ */
let ws = null, myId = null, myName = '', roomCode = '';
let isHost = false, myReady = false;
let myBoard = [], marked = new Array(25).fill(false);
let bingoLines = new Set(), myBingoCount = 0;
let myTurn = false, gameStarted = false, gameOver = false;
let players = {}, calledNumbers = [], oppBingoCount = 0;

const LINES = [];
for(let r=0;r<5;r++){const l=[];for(let c=0;c<5;c++)l.push(r*5+c);LINES.push(l);}
for(let c=0;c<5;c++){const l=[];for(let r=0;r<5;r++)l.push(r*5+c);LINES.push(l);}
LINES.push([0,6,12,18,24]);LINES.push([4,8,12,16,20]);

/* ════════════════ WebSocket ════════════════ */
function connect(){
  const url=(location.protocol==='https:'?'wss://':'ws://')+location.host;
  ws=new WebSocket(url);
  ws.onopen=()=>setStatus('entry','연결됨! 이름을 입력하세요.','var(--a3)');
  ws.onclose=()=>{setStatus('entry','연결이 끊어졌어요. 새로고침 해주세요.','var(--a2)');setTimeout(connect,3000)};
  ws.onerror=()=>setStatus('entry','연결 오류.','var(--a2)');
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}onMsg(m)};
}

function send(obj){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(obj));}

function onMsg(m){
  switch(m.type){
    case 'connected':
      myId=m.id;
      break;

    case 'bingo_room_joined':
      roomCode=m.code; isHost=m.isHost;
      players={}; m.players.forEach(p=>players[p.id]=p);
      document.getElementById('lobby-code').textContent=m.code;
      updatePlayerList(); updateLobbyBtns();
      buildSetupGrid(); myReady=false;
      showPage('lobby');
      setStatus('lobby', isHost?'상대방을 기다리는 중... 코드를 공유하세요!':'방에 입장했어요! 보드를 설정하고 준비 버튼을 누르세요.','var(--a3)');
      break;

    case 'bingo_lobby':
      players={}; m.players.forEach(p=>players[p.id]=p);
      if(players[myId]) myReady=players[myId].ready;
      isHost=m.hostId===myId;
      updatePlayerList(); updateLobbyBtns();
      if(m.phase==='lobby'&&gameStarted){
        // Restarted
        gameStarted=false; gameOver=false; myReady=false;
        buildSetupGrid();
        showPage('lobby');
        setStatus('lobby','게임이 재시작되었어요. 보드를 설정하고 준비하세요!','var(--a3)');
      }
      break;

    case 'bingo_game_start':
      myTurn=m.firstTurnId===myId;
      gameStarted=true; gameOver=false;
      marked=new Array(25).fill(false);
      bingoLines=new Set(); myBingoCount=0; oppBingoCount=0;
      calledNumbers=[];
      buildGameGrid(); updateDots(); updateCalledNums(); updateTurnBox();
      // Set opponent name
      const oppId=Object.keys(players).find(id=>id!==myId);
      document.getElementById('opp-name-txt').textContent=players[oppId]?.name||'상대방';
      document.getElementById('opp-bingo-txt').textContent='0 빙고';
      document.getElementById('my-bingo-txt').textContent='0 빙고';
      showPage('game');
      break;

    case 'bingo_called':
      calledNumbers.push({num:m.number, byMe:m.callerId===myId});
      markNum(m.number);
      myTurn=m.nextTurnId===myId;
      updateCalledNums(); updateTurnBox();
      if(m.callerId!==myId) toast(`${m.callerName} → ${m.number}!`);
      break;

    case 'bingo_opponent_bingo':
      oppBingoCount=m.count;
      document.getElementById('opp-bingo-txt').textContent=`${oppBingoCount} 빙고`;
      break;

    case 'bingo_win':
      gameOver=true;
      showWin(m.winnerId===myId, m.winnerName);
      break;

    case 'bingo_opponent_left':
      toast('상대방이 나갔어요 😢');
      if(gameStarted&&!gameOver){
        gameOver=true;
        document.getElementById('win-title').textContent='🏆 승리!';
        document.getElementById('win-sub').textContent='상대방이 게임을 떠났어요.';
        document.getElementById('win-ov').classList.add('show');
      } else if(!gameStarted) {
        setStatus('lobby','상대방이 나갔어요. 새 코드를 공유하세요.','var(--a2)');
        players={};
        if(players[myId]) players[myId]={...players[myId]};
        updatePlayerList(); updateLobbyBtns();
      }
      break;

    case 'bingo_error':
    case 'error':
      toast('❌ '+m.msg);
      break;
  }
}

/* ════════════════ 방 관리 ════════════════ */
function createRoom(){
  const name=document.getElementById('entry-name').value.trim();
  if(!name){toast('이름을 입력해주세요!');return;}
  myName=name; sessionStorage.setItem('bingoName',name);
  send({type:'bingo_create',name});
}

function joinRoom(){
  const name=document.getElementById('entry-name').value.trim();
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  if(!name){toast('이름을 입력해주세요!');return;}
  if(code.length<4){toast('초대 코드를 입력해주세요!');return;}
  myName=name; sessionStorage.setItem('bingoName',name);
  send({type:'bingo_join',name,code});
}

function leaveRoom(){
  send({type:'bingo_leave'});
  gameStarted=false; gameOver=false; myReady=false;
  players={}; calledNumbers=[]; myBoard=[];
  document.getElementById('win-ov').classList.remove('show');
  document.getElementById('confetti').innerHTML='';
  showPage('entry');
  setStatus('entry','방을 나왔어요.','var(--muted)');
}

function goToMenu(){
  if(roomCode||gameStarted) send({type:'bingo_leave'});
  window.location.href='/menu';
}

function copyCode(){
  navigator.clipboard?.writeText(roomCode).then(()=>toast('코드를 복사했어요! 📋'));
}

/* ════════════════ 로비 ════════════════ */
function updatePlayerList(){
  const arr=Object.values(players);
  document.getElementById('players-title').textContent=`플레이어 (${arr.length}/2)`;
  document.getElementById('player-list').innerHTML=arr.map(p=>`
    <div class="p-item${p.id===myId?' me':''}">
      <div class="p-name">${esc(p.name)}${p.id===myId?' <span class="badge badge-you">나</span>':''}</div>
      ${p.isHost?'<span class="badge badge-host">방장</span>':''}
      <span class="badge ${p.ready?'badge-ready':'badge-wait'}">${p.ready?'준비완료':'대기중'}</span>
    </div>`).join('');
}

function updateLobbyBtns(){
  const startBtn=document.getElementById('start-btn');
  startBtn.style.display=isHost?'inline-block':'none';
  const arr=Object.values(players);
  const allReady=arr.length===2&&arr.every(p=>p.ready);
  startBtn.disabled=!allReady;

  const readyBtn=document.getElementById('ready-btn');
  readyBtn.textContent=myReady?'✗ 준비 취소':'✔ 준비';
  readyBtn.className=myReady?'btn btn-r':'btn btn-c';
}

function toggleReady(){
  if(!myReady){
    const vals=getSetupVals();
    if(vals.some(v=>v===null)){toast('모든 칸을 채워주세요!');return;}
    if(new Set(vals).size!==25){toast('중복된 숫자가 있어요!');return;}
    myBoard=vals;
  }
  myReady=!myReady;
  send({type:'bingo_ready',ready:myReady});
  updateLobbyBtns();
}

function startGame(){send({type:'bingo_start'});}

function sendRestart(){
  document.getElementById('win-ov').classList.remove('show');
  document.getElementById('confetti').innerHTML='';
  send({type:'bingo_restart'});
  if(!isHost){
    showPage('lobby'); myReady=false; buildSetupGrid();
    setStatus('lobby','방장이 재시작할 때까지 기다려주세요.','var(--a3)');
  }
}

/* ════════════════ 보드 설정 (로비) ════════════════ */
function buildSetupGrid(){
  const g=document.getElementById('setup-grid'); g.innerHTML='';
  for(let i=0;i<25;i++){
    const cell=document.createElement('div'); cell.className='sc'; cell.id=`sc-${i}`;
    const inp=document.createElement('input');
    inp.type='number'; inp.min=1; inp.max=25; inp.placeholder=(i+1).toString();
    inp.addEventListener('input',onSetupInput);
    inp.addEventListener('focus',()=>cell.style.borderColor='var(--a3)');
    inp.addEventListener('blur',()=>{cell.style.borderColor='';validateSetup()});
    cell.appendChild(inp); g.appendChild(cell);
  }
}

function onSetupInput(e){
  const v=parseInt(e.target.value), cell=e.target.parentElement;
  if(!e.target.value){cell.classList.remove('has-v');}
  else if(v<1||v>25||isNaN(v)){e.target.value='';cell.classList.remove('has-v');}
  else{cell.classList.add('has-v');}
}

function getSetupVals(){
  return Array.from({length:25},(_,i)=>{
    const inp=document.getElementById(`sc-${i}`)?.querySelector('input');
    return inp?parseInt(inp.value)||null:null;
  });
}

function validateSetup(){
  const vals=getSetupVals(), seen={};
  vals.forEach((v,i)=>{if(v!==null){if(!seen[v])seen[v]=[];seen[v].push(i);}});
  for(let i=0;i<25;i++){
    const cell=document.getElementById(`sc-${i}`), inp=cell?.querySelector('input');
    const v=parseInt(inp?.value);
    cell?.classList.toggle('dup',!!(inp&&!isNaN(v)&&seen[v]&&seen[v].length>1));
  }
}

function autoFill(){
  const nums=shuffle([...Array.from({length:25},(_,i)=>i+1)]);
  for(let i=0;i<25;i++){
    const inp=document.getElementById(`sc-${i}`)?.querySelector('input');
    if(inp){inp.value=nums[i];inp.parentElement.classList.add('has-v');inp.parentElement.classList.remove('dup');}
  }
}

function resetSetup(){buildSetupGrid();}

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=0|Math.random()*(i+1);[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

/* ════════════════ 게임 보드 ════════════════ */
function buildGameGrid(){
  const g=document.getElementById('game-grid'); g.innerHTML='';
  for(let i=0;i<25;i++){
    const cell=document.createElement('div');
    cell.className='gc'; cell.id=`gc-${i}`;
    cell.textContent=myBoard[i];
    cell.onclick=()=>callNum(i);
    g.appendChild(cell);
  }
  updateGridTurnClass();
}

function updateGridTurnClass(){
  const g=document.getElementById('game-grid');
  if(g) g.querySelectorAll('.gc').forEach(c=>c.classList.toggle('no-turn',!myTurn||gameOver));
}

function callNum(idx){
  if(!gameStarted||!myTurn||gameOver)return;
  const num=myBoard[idx];
  if(calledNumbers.some(c=>c.num===num)){toast('이미 불린 숫자예요!');return;}
  send({type:'bingo_call',number:num});
}

function markNum(num){
  const idx=myBoard.indexOf(num); if(idx===-1)return;
  marked[idx]=true;
  const cell=document.getElementById(`gc-${idx}`);
  if(cell){
    cell.classList.add('marked');
    const star=document.createElement('span');star.className='star';star.textContent='★';cell.appendChild(star);
  }
  checkBingo();
}

function checkBingo(){
  let count=0; const lineCells=new Set();
  LINES.forEach((line,li)=>{
    if(line.every(i=>marked[i])){
      count++; line.forEach(i=>lineCells.add(i));
      if(!bingoLines.has(li))bingoLines.add(li);
    }
  });

  for(let i=0;i<25;i++){
    const cell=document.getElementById(`gc-${i}`);if(!cell)continue;
    if(lineCells.has(i))cell.classList.add('bingo-line');
    else if(!marked[i])cell.classList.remove('bingo-line');
    else cell.classList.remove('bingo-line');
  }

  if(count!==myBingoCount){
    myBingoCount=count;
    document.getElementById('my-bingo-txt').textContent=`${myBingoCount} 빙고`;
    updateDots();
    send({type:'bingo_update_count',count:myBingoCount});
    if(myBingoCount>=5&&!gameOver){
      gameOver=true;
      send({type:'bingo_win_claim'});
    }
  }
}

function updateDots(){
  for(let i=0;i<5;i++){
    const d=document.getElementById(`md${i}`);
    if(i<myBingoCount)d.classList.add('lit');else d.classList.remove('lit');
  }
}

function updateTurnBox(){
  const box=document.getElementById('turn-box');
  if(myTurn){box.textContent='⭐ 내 차례 — 숫자를 클릭하세요!';box.className='turn-box my-turn';}
  else{
    const oppId=Object.keys(players).find(id=>id!==myId);
    box.textContent=`⏳ ${players[oppId]?.name||'상대방'}의 차례`;
    box.className='turn-box';
  }
  updateGridTurnClass();
}

function updateCalledNums(){
  const wrap=document.getElementById('called-nums');
  if(!calledNumbers.length){wrap.innerHTML='<span style="color:var(--muted);font-size:.75rem">아직 없어요</span>';return;}
  wrap.innerHTML=calledNumbers.slice(-20).map(c=>`<span class="cn${c.byMe?' mine':''}">${c.num}</span>`).join('');
}

function showWin(iWon, winnerName){
  spawnConfetti();
  document.getElementById('win-title').textContent=iWon?'🏆 승리!':'😢 패배';
  document.getElementById('win-sub').textContent=iWon
    ?`5빙고 달성! 완벽합니다 🎉`
    :`${winnerName}이(가) 먼저 5빙고를 달성했어요!`;
  document.getElementById('win-ov').classList.add('show');
}

function spawnConfetti(){
  const wrap=document.getElementById('confetti');wrap.innerHTML='';
  const cols=['#f7c948','#ff5e87','#4ef7c9','#a78bfa','#fff'];
  for(let i=0;i<70;i++){
    const p=document.createElement('div');p.className='cp';
    p.style.left=Math.random()*100+'vw';
    p.style.width=(5+Math.random()*8)+'px';p.style.height=p.style.width;
    p.style.background=cols[0|Math.random()*cols.length];
    p.style.animationDuration=(2+Math.random()*3)+'s';
    p.style.animationDelay=(Math.random()*2)+'s';
    p.style.borderRadius=Math.random()>.5?'50%':'2px';
    wrap.appendChild(p);
  }
}

/* ════════════════ UI 헬퍼 ════════════════ */
function showPage(name){
  ['entry','lobby','game'].forEach(n=>{const el=document.getElementById('page-'+n);if(el)el.classList.remove('active')});
  document.getElementById('page-'+name)?.classList.add('active');
}

function setStatus(page, msg, color){
  const el=document.getElementById('status-'+page);
  if(el){el.textContent=msg;el.style.color=color||'var(--a3)';}
}

let _toastT=null;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),2500);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ════════════════ 초기화 ════════════════ */
const savedName=sessionStorage.getItem('bingoName');
if(savedName)document.getElementById('entry-name').value=savedName;

document.getElementById('join-code').addEventListener('input',e=>{
  e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');
});
document.getElementById('entry-name').addEventListener('keydown',e=>{
  if(e.key==='Enter')createRoom();
});

connect();
</script>
</body>

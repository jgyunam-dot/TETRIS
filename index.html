<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 게임 허브</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080815;--card:#10102a;--border:#1e1e45;--a1:#f7c948;--a2:#ff5e87;--a3:#4ef7c9;--text:#e8e8ff;--muted:#555588}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;
  background-image:radial-gradient(ellipse at 20% 10%,rgba(78,247,201,.07) 0%,transparent 50%),
  radial-gradient(ellipse at 80% 90%,rgba(255,94,135,.07) 0%,transparent 50%),
  radial-gradient(ellipse at 50% 50%,rgba(247,201,72,.04) 0%,transparent 70%)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}

.logo{font-family:'Black Han Sans',sans-serif;font-size:clamp(2.2rem,8vw,4rem);letter-spacing:.2em;
  background:linear-gradient(135deg,var(--a1),var(--a2),var(--a3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:glow 3s ease-in-out infinite alternate;margin-bottom:6px;text-align:center}
@keyframes glow{from{filter:drop-shadow(0 0 12px rgba(247,201,72,.3))}to{filter:drop-shadow(0 0 32px rgba(247,201,72,.7))}}
.sub{font-size:.75rem;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;margin-bottom:40px;text-align:center}

.games{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;width:100%;max-width:520px}

.game-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--card);border:2px solid var(--border);border-radius:20px;
  padding:30px 24px;flex:1;min-width:180px;max-width:230px;
  text-decoration:none;color:var(--text);cursor:pointer;
  transition:all .25s;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .25s}
.game-card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--hover-color)}
.game-card:hover::before{opacity:1}
.game-card:active{transform:scale(.97)}

.game-card.bingo{--hover-color:var(--a1)}
.game-card.bingo::before{background:radial-gradient(ellipse at 50% 100%,rgba(247,201,72,.12) 0%,transparent 70%)}
.game-card.bingo:hover{box-shadow:0 8px 32px rgba(247,201,72,.25)}

.game-card.tetris{--hover-color:var(--a3)}
.game-card.tetris::before{background:radial-gradient(ellipse at 50% 100%,rgba(78,247,201,.12) 0%,transparent 70%)}
.game-card.tetris:hover{box-shadow:0 8px 32px rgba(78,247,201,.25)}

.game-icon{font-size:clamp(3rem,10vw,4.5rem);line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.game-title{font-family:'Black Han Sans',sans-serif;font-size:clamp(1.2rem,4vw,1.6rem);letter-spacing:.1em}
.game-badge{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:20px;font-family:'Black Han Sans',sans-serif}
.game-card.bingo .game-title{color:var(--a1)}
.game-card.bingo .game-badge{background:rgba(247,201,72,.12);color:var(--a1);border:1px solid rgba(247,201,72,.3)}
.game-card.tetris .game-title{color:var(--a3)}
.game-card.tetris .game-badge{background:rgba(78,247,201,.12);color:var(--a3);border:1px solid rgba(78,247,201,.3)}
.game-desc{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.4}

.footer{margin-top:40px;font-size:.68rem;color:var(--muted);letter-spacing:.1em;text-align:center}
</style>
</head>
<body>

<div class="logo">GAME HUB</div>
<div class="sub">플레이할 게임을 선택하세요</div>

<div class="games">
  <a href="/bingo" class="game-card bingo">
    <div class="game-icon">🎯</div>
    <div class="game-title">빙고</div>
    <div class="game-badge">1 vs 1</div>
    <div class="game-desc">온라인 턴제 빙고<br>5빙고 달성하면 승리!</div>
  </a>
  <a href="/tetris" class="game-card tetris">
    <div class="game-icon">🧱</div>
    <div class="game-title">테트리스</div>
    <div class="game-badge">멀티플레이어</div>
    <div class="game-desc">온라인 배틀 테트리스<br>최대 8명 동시 대전!</div>
  </a>
</div>

<div class="footer">게임을 선택해서 방을 만들거나 참가하세요 🎮</div>

</body>
</html>
